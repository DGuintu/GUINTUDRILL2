<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Member Management System</title>
    
    <!-- PyScript CSS & JS Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Enhanced Custom Styling -->
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .main-card {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        .btn-custom {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
        }
        .directory-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card main-card p-4 p-md-5 bg-white">
                    <div class="card-body p-0">
                        
                        <!-- Header Section -->
                        <div class="text-center mb-4">
                            <div class="inline-block p-3 bg-primary-subtle text-primary rounded-circle mb-3">
                                <i class="bi bi-people-fill fs-2"></i>
                            </div>
                            <h2 class="fw-bold text-dark mb-1">Student Club Management</h2>
                           
                        </div>

                        <!-- Input Form Fields -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="first-name" class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">
                                    <i class="bi bi-person me-1"></i> First Name
                                </label>
                                <input type="text" id="first-name" class="form-control py-2" placeholder="e.g. Juan">
                            </div>
                            <div class="col-md-6">
                                <label for="last-name" class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">
                                    <i class="bi bi-person-badge me-1"></i> Last Name
                                </label>
                                <input type="text" id="last-name" class="form-control py-2" placeholder="e.g. Dela Cruz">
                            </div>
                        </div>

                        <!-- Trigger Button -->
                        <button id="add-btn" class="btn btn-primary btn-custom w-100 py-3 fw-bold shadow-sm rounded-pill mb-4" py-click="add_member_handler">
                            <i class="bi bi-person-plus-fill me-2"></i> Add Member & Update Master Set
                        </button>

                        <!-- Results Display Area -->
                        <div class="directory-box p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold text-dark m-0">
                                    <i class="bi bi-card-checklist text-primary me-2"></i> Club Directory Status
                                </h5>
                                <div class="d-flex align-items-center">
                                    <span class="text-muted small me-2">Total Members:</span>
                                    <span id="total-output" class="badge bg-primary fs-6 px-3 py-2 rounded-pill shadow-sm">8</span>
                                </div>
                            </div>

                            <hr class="text-muted opacity-25">

                            <div>
                                <span class="fw-semibold text-secondary small d-block mb-2">FULL MEMBER LIST (MASTER SET):</span>
                                <div id="member-list-output" class="p-2 bg-white rounded-3 border d-flex flex-wrap gap-1 align-items-center" style="min-height: 80px;">
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Thalia Sazaar</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Dallas Quinton</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Fiona Dunkin</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Pricilla Dovey</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Gracie Elliot</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Gruntun Gallagher</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Susanne Collins</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium fs-6 m-1">Lynn Painter</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Connect external Python script -->
    <script type="py" src="./main.py"></script>

</body>
</html>
